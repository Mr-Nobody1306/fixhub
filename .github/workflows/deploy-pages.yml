name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Set backend URL
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          node -e '
            const fs = require("node:fs");
            const raw = (process.env.BACKEND_URL || "").trim();
            if (!raw) throw new Error("Set the BACKEND_URL repository variable to the hosted API URL.");
            const url = new URL(raw);
            if (url.protocol !== "https:" || url.pathname !== "/" || url.search || url.hash) {
              throw new Error("BACKEND_URL must be an HTTPS origin without a path.");
            }
            fs.writeFileSync("public/deploy-config.js",
              "window.FIXHUB_API_BASE_URL = " + JSON.stringify(url.origin) + ";\n");
          '
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
